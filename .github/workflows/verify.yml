name: Verify

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out Controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: open-DSP-408
          persist-credentials: false

      - name: Read protocol revision
        id: protocol
        shell: bash
        run: |
          protocol_ref="$(cat open-DSP-408/ci/protocol-revision)"
          if [[ ! "$protocol_ref" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'Invalid protocol revision: expected a full 40-character lowercase commit SHA.' >&2
            exit 2
          fi
          printf 'ref=%s\n' "$protocol_ref" >> "$GITHUB_OUTPUT"

      - name: Check out protocol source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DoctorRemoteControl/dsp408-protocol
          ref: ${{ steps.protocol.outputs.ref }}
          path: dsp408-protocol
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false

      - name: Set up Node for browser checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Verify browser model and interface
        working-directory: open-DSP-408
        run: |
          npm ci --ignore-scripts
          npm run test:web
          npx playwright-core install chromium
          npm run test:browser

      - name: Verify checkout validation and provenance
        run: python3 open-DSP-408/ci/test_verify.py

      - name: Verify and install bundles
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/dsp408-m2
        run: bash open-DSP-408/ci/verify.sh

      - name: Verify integration tooling
        working-directory: open-DSP-408
        run: |
          python3 -m unittest discover -s integration -p 'test_*.py'
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Stress loopback connection lifecycle
        working-directory: open-DSP-408
        run: >-
          python3 integration/connection_stress.py --cycles 100
          --maven-repo "${{ runner.temp }}/dsp408-m2"
          --state-dir "${{ runner.temp }}/dsp408-connection-stress"

      - name: Verify headless Java API and persistent device registry
        run: >-
          python3 open-DSP-408/integration/karaf-smoke.py
          --maven-repo "${{ runner.temp }}/dsp408-m2"
          --state-dir "${{ runner.temp }}/dsp408-headless-registry"
          --headless-registry

      - name: Verify fresh Karaf with simulated DSPs
        run: >-
          python3 open-DSP-408/integration/karaf-smoke.py
          --maven-repo "${{ runner.temp }}/dsp408-m2"
          --state-dir "${{ runner.temp }}/dsp408-karaf-smoke"
          --browser-check

      - name: Verify installable offline server
        run: >-
          python3 open-DSP-408/integration/server-package-smoke.py
          --archive open-DSP-408/dsp408-parent/dsp408-server/target/dsp408-server-*.tar.gz
          --state-dir "${{ runner.temp }}/dsp408-server-package"

      - name: Verify live streams and coordinated browsers
        run: >-
          python3 open-DSP-408/integration/live-control-smoke.py
          --archive open-DSP-408/dsp408-parent/dsp408-server/target/dsp408-server-*.tar.gz
          --state-dir "${{ runner.temp }}/dsp408-live-control"
          --browser-check

      - name: Hash server downloads
        working-directory: open-DSP-408/dsp408-parent/dsp408-server/target
        run: sha256sum dsp408-server-*.tar.gz dsp408-server-*.zip > dsp408-server-SHA256SUMS.txt

      - name: Upload installable server
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsp408-server-${{ github.sha }}
          path: |
            open-DSP-408/dsp408-parent/dsp408-server/target/dsp408-server-*.tar.gz
            open-DSP-408/dsp408-parent/dsp408-server/target/dsp408-server-*.zip
            open-DSP-408/dsp408-parent/dsp408-server/target/dsp408-server-SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
